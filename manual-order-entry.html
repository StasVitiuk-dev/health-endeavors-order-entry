<head>

<title>Health Endeavors — Manual Order Entry</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<link rel="stylesheet" href="assets/manual-order-entry.css?v=c4f7901dbd">
</head>
<body>
<div class="wrap">

  <div id="loginView" class="card loginCard">
    <span class="eyebrow">Health Endeavors</span>
    <h1>Sign in</h1>
    <p class="subtitle">Use your owner/employee account to add an order.</p>
    <div id="loginError" class="msg error" hidden></div>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="email" />
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password" />
    </div>
    <button id="loginBtn" class="btn-primary">Sign in</button>
  </div>

  <div id="appView" hidden>
    <div class="topbar">
      <div>
        <span class="eyebrow">Health Endeavors</span>
        <h1>New manual order</h1>
      </div>
      <div class="who">
        <span id="whoEmail"></span>
        <button id="signOutBtn" class="btn-secondary signOutSmall">Sign out</button>
      </div>
    </div>
    <p class="subtitle">For wholesale, physical/in-person, or other sales that don't come through Shopify.</p>

    <div id="formMsg" class="msg error" hidden></div>
    <div id="unfinishedMsg" class="msg error" hidden></div>
    <div id="successMsg" class="msg success" hidden></div>

    <form id="orderForm">
      <div class="card">
        <div class="row2">
          <div class="field">
            <label for="channel">Sale type</label>
            <select id="channel" required>
              <option value="wholesale">Wholesale</option>
              <option value="physical">Physical / in-person</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="orderDate">Date</label>
            <input id="orderDate" type="date" required />
          </div>
        </div>
        <div class="field">
          <label for="customerName">Customer / store name</label>
          <input id="customerName" type="text" required placeholder="e.g. Aroma Paradise, or a walk-in customer's name" />
        </div>
        <div class="field">
          <label for="customerEmail">Customer email (optional)</label>
          <input id="customerEmail" type="email" placeholder="optional" />
        </div>
        <div class="row2">
          <div class="field">
            <label for="status">Status</label>
            <select id="status">
              <option value="paid">Paid</option>
              <option value="pending">Pending payment</option>
              <option value="refunded">Refunded</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field">
            <label for="currency">Currency</label>
            <select id="currency">
              <option value="USD">USD</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <label class="itemsLabel">Items</label>
        <div id="itemsContainer"></div>
        <button type="button" id="addItemBtn" class="btn-text">+ Add another item</button>

        <div class="totals">
          <div class="totals-row"><span>Subtotal</span><span id="subtotalOut">$0.00</span></div>
          <div class="totals-row">
            <span>Shipping</span>
            <input id="shippingTotal" type="number" step="0.01" min="0" max="1000000" value="0" class="totalsInput" />
          </div>
          <div class="totals-row">
            <span>Tax</span>
            <input id="taxTotal" type="number" step="0.01" min="0" max="1000000" value="0" class="totalsInput" />
          </div>
          <div class="totals-row grand"><span>Total</span><span id="totalOut">$0.00</span></div>
        </div>
      </div>

      <button id="submitBtn" type="submit" class="btn-primary">Save order</button>
    </form>
  </div>

</div>

<script src="assets/manual-order-entry.js?v=47d1afde98"></script>
</body>
</html>
