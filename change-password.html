<style>
  :root{
    --page:#f5f5f7;
    --navy:#1d1d1f;
    --teal:#0071e3;
    --cream:#ffffff;
    --ink:#1d1d1f;
    --muted:#6e6e73;
    --field-border:#d2d2d7;
    --copper:#0071e3;
    --danger:#d70015;
    --danger-bg:#fdf0ef;
    --good:#1d8a3f;
    --good-bg:#eef7f0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#000000;
      --navy:#f5f5f7;
      --teal:#2997ff;
      --cream:#1d1d1f;
      --ink:#f5f5f7;
      --muted:#a1a1a6;
      --field-border:#48484a;
      --copper:#2997ff;
      --danger:#ff6961;
      --danger-bg:#2c1d1d;
      --good:#30d158;
      --good-bg:#16291c;
    }
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:var(--page);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  #screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg, var(--navy), var(--teal));
    padding:24px;
  }
  .card{
    background:var(--cream);
    border-radius:16px;
    padding:40px 36px;
    width:100%;
    max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .card h1{ margin:0 0 4px; font-size:22px; color:var(--navy); }
  .card p.sub{ margin:0 0 24px; color:var(--muted); font-size:14px; }
  .whoLine{
    font-size:13px; color:var(--muted); margin:-12px 0 22px;
    padding:8px 12px; background:var(--page); border-radius:8px;
  }
  label{ display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:6px; }
  input[type=email], input[type=password]{
    width:100%;
    padding:11px 12px;
    margin-bottom:18px;
    border:1px solid var(--field-border);
    border-radius:8px;
    font-size:16px;
    background:var(--cream);
    color:var(--ink);
  }
  button{
    padding:11px 16px;
    background:var(--copper);
    color:white;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  button:disabled{ opacity:0.55; cursor:default; }
  button.secondary{
    background:transparent; color:var(--navy); border:1px solid var(--navy);
    margin-top:10px;
  }
  .msg{ margin-top:16px; font-size:13px; text-align:center; }
  .msg.error{ color:var(--danger); }
  .msg.good{ color:var(--good); }
  .bannerBox{
    display:none; text-align:left; white-space:pre-wrap; margin-bottom:16px;
    border:1px solid var(--danger); border-radius:8px; padding:10px 12px;
    background:var(--danger-bg); color:var(--danger); font-size:13px;
  }
  .successBox{
    display:none; text-align:left; margin-bottom:16px;
    border:1px solid var(--good); border-radius:8px; padding:12px 14px;
    background:var(--good-bg); color:var(--good); font-size:14px; font-weight:600;
  }
  .hint{ font-size:12px; color:var(--muted); margin:-12px 0 18px; }
</style>
</head>
<body>

<div id="screen">
  <div class="card" id="card">

    <div id="scriptError" class="bannerBox"></div>

    <!-- ===== STEP 1: LOG IN (only shown if not already signed in) ===== -->
    <div id="loginStep" style="display:none;">
      <h1>Health Endeavors</h1>
      <p class="sub">Log in to change your password</p>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
        <label for="loginPassword">Current password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <button type="submit" id="loginBtn">Log In</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- ===== STEP 2: CHANGE PASSWORD ===== -->
    <div id="changeStep" style="display:none;">
      <h1 id="changeTitle">Change Password</h1>
      <p class="sub" id="changeSubtitle">Set a new password for your account</p>
      <div class="whoLine" id="whoLine"></div>

      <div class="successBox" id="successBox"></div>

      <form id="changeForm">
        <div id="currentPasswordRow">
          <label for="currentPassword">Current password</label>
          <input type="password" id="currentPassword" autocomplete="current-password">
        </div>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" required>
        <div class="hint">At least 8 characters.</div>
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required>
        <button type="submit" id="changeBtn">Change Password</button>
      </form>
      <button type="button" class="secondary" id="signOutBtn">Sign out</button>
      <div id="changeMsg" class="msg"></div>
    </div>

  </div>
</div>

<script src="assets/change-password.js?v=439d4b0107"></script>

</body>
</html>
