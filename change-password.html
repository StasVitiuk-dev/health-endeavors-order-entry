<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Health Endeavors">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://uizrazyehilyzmwttsrn.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://uizrazyehilyzmwttsrn.supabase.co">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Health Endeavors — Change Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__sbLoadFailed=true"></script>
<style>
  :root{
    --page:#f5f5f7;
    --navy:#1d1d1f;
    --teal:#0071e3;
    --cream:#ffffff;
    --ink:#1d1d1f;
    --muted:#6e6e73;
    --field-border:#d2d2d7;
    --copper:#0071e3;
    --danger:#d70015;
    --danger-bg:#fdf0ef;
    --good:#1d8a3f;
    --good-bg:#eef7f0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#000000;
      --navy:#f5f5f7;
      --teal:#2997ff;
      --cream:#1d1d1f;
      --ink:#f5f5f7;
      --muted:#a1a1a6;
      --field-border:#48484a;
      --copper:#2997ff;
      --danger:#ff6961;
      --danger-bg:#2c1d1d;
      --good:#30d158;
      --good-bg:#16291c;
    }
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:var(--page);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color:var(--ink);
  }
  #screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg, var(--navy), var(--teal));
    padding:24px;
  }
  .card{
    background:var(--cream);
    border-radius:16px;
    padding:40px 36px;
    width:100%;
    max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .card h1{ margin:0 0 4px; font-size:22px; color:var(--navy); }
  .card p.sub{ margin:0 0 24px; color:var(--muted); font-size:14px; }
  .whoLine{
    font-size:13px; color:var(--muted); margin:-12px 0 22px;
    padding:8px 12px; background:var(--page); border-radius:8px;
  }
  label{ display:block; font-size:13px; font-weight:600; color:var(--navy); margin-bottom:6px; }
  input[type=email], input[type=password]{
    width:100%;
    padding:11px 12px;
    margin-bottom:18px;
    border:1px solid var(--field-border);
    border-radius:8px;
    font-size:16px;
    background:var(--cream);
    color:var(--ink);
  }
  button{
    padding:11px 16px;
    background:var(--copper);
    color:white;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    width:100%;
  }
  button:disabled{ opacity:0.55; cursor:default; }
  button.secondary{
    background:transparent; color:var(--navy); border:1px solid var(--navy);
    margin-top:10px;
  }
  .msg{ margin-top:16px; font-size:13px; text-align:center; }
  .msg.error{ color:var(--danger); }
  .msg.good{ color:var(--good); }
  .bannerBox{
    display:none; text-align:left; white-space:pre-wrap; margin-bottom:16px;
    border:1px solid var(--danger); border-radius:8px; padding:10px 12px;
    background:var(--danger-bg); color:var(--danger); font-size:13px;
  }
  .successBox{
    display:none; text-align:left; margin-bottom:16px;
    border:1px solid var(--good); border-radius:8px; padding:12px 14px;
    background:var(--good-bg); color:var(--good); font-size:14px; font-weight:600;
  }
  .hint{ font-size:12px; color:var(--muted); margin:-12px 0 18px; }
</style>
</head>
<body>

<div id="screen">
  <div class="card" id="card">

    <div id="scriptError" class="bannerBox"></div>

    <!-- ===== STEP 1: LOG IN (only shown if not already signed in) ===== -->
    <div id="loginStep" style="display:none;">
      <h1>Health Endeavors</h1>
      <p class="sub">Log in to change your password</p>
      <form id="loginForm">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" autocomplete="username" required>
        <label for="loginPassword">Current password</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
        <button type="submit" id="loginBtn">Log In</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </div>

    <!-- ===== STEP 2: CHANGE PASSWORD ===== -->
    <div id="changeStep" style="display:none;">
      <h1 id="changeTitle">Change Password</h1>
      <p class="sub" id="changeSubtitle">Set a new password for your account</p>
      <div class="whoLine" id="whoLine"></div>

      <div class="successBox" id="successBox"></div>

      <form id="changeForm">
        <div id="currentPasswordRow">
          <label for="currentPassword">Current password</label>
          <input type="password" id="currentPassword" autocomplete="current-password">
        </div>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" required>
        <div class="hint">At least 8 characters.</div>
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required>
        <button type="submit" id="changeBtn">Change Password</button>
      </form>
      <button type="button" class="secondary" id="signOutBtn">Sign out</button>
      <div id="changeMsg" class="msg"></div>
    </div>

  </div>
</div>

<script>
(function(){
  if (window.__sbLoadFailed || !window.supabase) {
    document.getElementById('scriptError').style.display = 'block';
    document.getElementById('scriptError').textContent =
      "This page couldn't load a required file. Check your internet connection and reload the page.";
    document.getElementById('loginStep').style.display = 'block';
    return;
  }

  const SUPABASE_URL = "https://uizrazyehilyzmwttsrn.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_n0sEzZK0JMtwgk280a3YXA_zxtnheqj";

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // A second, non-persistent client used only to re-check the current password
  // without disturbing the real logged-in session.
  const verifyOnly = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false,
      storageKey: 'he_password_check_only',
      lock: (name, acquireTimeout, fn) => fn(),
    },
  });

  const loginStep = document.getElementById('loginStep');
  const changeStep = document.getElementById('changeStep');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginMsg = document.getElementById('loginMsg');
  const changeForm = document.getElementById('changeForm');
  const changeBtn = document.getElementById('changeBtn');
  const changeMsg = document.getElementById('changeMsg');
  const whoLine = document.getElementById('whoLine');
  const successBox = document.getElementById('successBox');
  const signOutBtn = document.getElementById('signOutBtn');

  let isRecovery = false;
  let changeStepShown = false;

  function showLoginStep(){
    if (changeStepShown) return; // never downgrade out of an already-shown recovery/change step
    loginStep.style.display = 'block';
    changeStep.style.display = 'none';
  }
  function showChangeStep(user, recovery){
    isRecovery = !!recovery;
    changeStepShown = true;
    loginStep.style.display = 'none';
    changeStep.style.display = 'block';
    whoLine.textContent = 'Signed in as ' + (user && user.email ? user.email : 'unknown account');
    document.getElementById('currentPasswordRow').style.display = isRecovery ? 'none' : 'block';
    document.getElementById('changeTitle').textContent = isRecovery ? 'Reset Your Password' : 'Change Password';
    document.getElementById('changeSubtitle').textContent = isRecovery
      ? 'Choose a new password for your account.'
      : 'Set a new password for your account';
  }

  // Fires when this page was opened from a "forgot password" email link —
  // Supabase reads the recovery token out of the URL and signs the person in
  // just enough to set a new password, without them needing to know the old one.
  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY' && session && session.user) {
      showChangeStep(session.user, true);
    }
  });

  // On load: if already signed in (session persists across pages on this site,
  // or was just established by the recovery link above), skip straight to the
  // change-password form.
  supabase.auth.getSession().then(({ data }) => {
    if (changeStepShown) return;
    if (data && data.session && data.session.user) {
      showChangeStep(data.session.user, false);
    } else {
      showLoginStep();
    }
  }).catch(() => { showLoginStep(); });

  loginForm.addEventListener('submit', async function(e){
    e.preventDefault();
    loginMsg.textContent = '';
    loginMsg.className = 'msg';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in…';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.textContent = 'Log In';

    if (error || !data || !data.user) {
      loginMsg.textContent = 'Could not log in. Check your email and password and try again.';
      loginMsg.className = 'msg error';
      return;
    }

    showChangeStep(data.user, false);
  });

  changeForm.addEventListener('submit', async function(e){
    e.preventDefault();
    changeMsg.textContent = '';
    changeMsg.className = 'msg';
    successBox.style.display = 'none';

    const currentPassword = document.getElementById('currentPassword').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    const { data: sessionData } = await supabase.auth.getSession();
    const user = sessionData && sessionData.session && sessionData.session.user;
    if (!user || !user.email) {
      changeMsg.textContent = 'Your session expired. Please log in again.';
      changeMsg.className = 'msg error';
      showLoginStep();
      return;
    }

    if (!isRecovery && !currentPassword) {
      changeMsg.textContent = 'Enter your current password.';
      changeMsg.className = 'msg error';
      return;
    }
    if (newPassword.length < 8) {
      changeMsg.textContent = 'New password must be at least 8 characters.';
      changeMsg.className = 'msg error';
      return;
    }
    if (newPassword !== confirmPassword) {
      changeMsg.textContent = 'New password and confirmation do not match.';
      changeMsg.className = 'msg error';
      return;
    }

    changeBtn.disabled = true;

    if (!isRecovery) {
      changeBtn.textContent = 'Checking current password…';

      // Verify the current password is correct before allowing the change,
      // without touching the real logged-in session.
      const { error: verifyError } = await verifyOnly.auth.signInWithPassword({
        email: user.email,
        password: currentPassword,
      });
      try { await verifyOnly.auth.signOut({ scope: 'local' }); } catch (e) { /* ignore */ }

      if (verifyError) {
        changeBtn.disabled = false;
        changeBtn.textContent = 'Change Password';
        changeMsg.textContent = 'Current password is incorrect.';
        changeMsg.className = 'msg error';
        return;
      }
    }
    // In a recovery flow, the emailed link itself already proved this is the
    // account owner — no need to also ask for a password they've forgotten.

    changeBtn.textContent = 'Saving new password…';

    const { error: updateError } = await supabase.auth.updateUser({ password: newPassword });

    changeBtn.disabled = false;
    changeBtn.textContent = 'Change Password';

    if (updateError) {
      changeMsg.textContent = 'Something went wrong saving your new password. Please try again.';
      changeMsg.className = 'msg error';
      return;
    }

    changeForm.reset();
    successBox.style.display = 'block';
    successBox.textContent = isRecovery
      ? 'Your password has been set. Use it to log in from now on.'
      : 'Your password has been changed. Use your new password next time you log in.';
    changeMsg.textContent = '';
  });

  signOutBtn.addEventListener('click', async function(){
    try { await supabase.auth.signOut(); } catch (e) { /* ignore */ }
    showLoginStep();
    document.getElementById('loginEmail').value = '';
    document.getElementById('loginPassword').value = '';
  });
})();
</script>

</body>
</html>
