# Dashboard CI (EXT14) — TESTS ONLY. No deploy, no secrets, read-only token.
#
# What it does: on every pull request to main, every push to a claude/** branch
# and on demand, it runs the dashboard's local test suite (synthetic data,
# mocked Supabase), the SQL safety checks, the documentation checks and the
# local database suite on a throwaway PostgreSQL inside the runner.
#
# What it can NOT do: it has no secrets, only `contents: read`, no deployment
# or Pages step, never checks out another repository, and never contacts
# Supabase, Shopify or the live site (the test mock blocks every outside
# request). tests/specs/ci-guard-ext14.spec.js fails if any of that changes.
# Local equivalent: npm run ci:local   (guide: docs/ops/CI_GUIDE_EXT14.md)
name: Dashboard CI (tests only, no deploy)

on:
  pull_request:
    branches: [main]
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks on every change: secrets, SQL safety, docs, Node-only tools.
  static:
    name: Static, SQL safety, docs, tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      browser: ${{ steps.impact.outputs.browser }}
      db: ${{ steps.impact.outputs.db }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          node-version: 22
          cache: npm
      - name: Install exact test dependencies (package-lock, no install scripts)
        run: npm ci --ignore-scripts
      - name: Decide which heavy jobs this change needs (conservative)
        id: impact
        # EXT15: a push is compared with main (everything on the branch not yet merged), not with the
        # previous push: otherwise a docs-only push that cancels a code push's run skips the browser suite.
        run: node tests/tools/ci-impact.js "${{ github.event.pull_request.base.sha || 'origin/main' }}" >> "$GITHUB_OUTPUT"
      - name: Secret scan (tracked files)
        run: node tests/tools/secret-scan.js
      - name: SQL package lint
        run: node tests/tools/sql-lint.js
      - name: Status manifest is consistent (no production claim without production evidence)
        run: node tests/tools/status-validate.js
      - name: Module graph (created once, dependency order, no cycles, no hidden dependencies)
        run: node tests/tools/app-modules.js
      - name: No inline styles left on the owner page (strict style policy)
        run: node tests/tools/inline-styles.js --check
      - name: Type-check gate on the module files (TypeScript checker, plain JavaScript)
        run: node tests/tools/typecheck.js --gate
      - name: Documentation check
        run: node tests/tools/doc-check.js --current
      - name: Static security check (no eval / document.write / inline handlers; exact-file script policy; frame guard)
        run: node tests/tools/static-security.js
      - name: DOM sink gate (dangerous HTML sinks at 0; every unescaped-looking value reviewed)
        run: node tests/tools/dom-sinks.js --gate
      - name: Slow-regex audit (no pattern can freeze the page on huge input)
        run: node tests/tools/regex-audit.js
      - name: Schema contract (every table/column the page names exists in the real-shape schema)
        run: node tests/tools/schema-contract.js
      - name: Node-only specs (tools, SQL static, docs, CI guard)
        run: npx playwright test --config tests/playwright.config.js --project=desktop --reporter=list,github tests/specs/ci-guard-ext14.spec.js tests/specs/sql-package-ext14.spec.js tests/specs/sql-drafts-static.spec.js tests/specs/sql-readonly.spec.js tests/specs/docs-integrity-ext13.spec.js tests/specs/evidence-ext12.spec.js tests/specs/deploy-sim-ext12.spec.js tests/specs/incidents-ext12.spec.js tests/specs/query-interpreter-ext10.spec.js tests/specs/helpers-unit.spec.js tests/specs/status-manifest-ext14.spec.js tests/specs/screenshots-policy-ext14.spec.js tests/specs/ci-traps-ext15.spec.js tests/specs/property-node-ext15.spec.js tests/specs/security-static-ext18.spec.js tests/specs/security-parsers-ext18.spec.js tests/specs/supply-chain-ext18.spec.js tests/specs/state-contract-ext19.spec.js tests/specs/schema-drift-ext20.spec.js tests/specs/agent-safety-ext20.spec.js

  # The browser suite, split in three (Playwright shards; every test runs once).
  browser:
    name: Browser suite (shard ${{ matrix.shard }}/3)
    needs: static
    if: needs.static.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          persist-credentials: false
          fetch-depth: 0   # EXT15: the module move proof (verify-moves.js) compares with the EXT14 commit 3a40095
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the test browser (version fixed by package-lock)
        run: npx playwright install --with-deps chromium
      - name: Run shard ${{ matrix.shard }} of 3 (balanced by duration; screenshot comparisons excluded, see the visual job)
        # EXT15: shards balanced by measured duration (tests/ci-durations.json); every spec file is in exactly one shard
        run: npx playwright test --config tests/playwright.config.js $(node tests/tools/ci-shards.js --list ${{ matrix.shard }}/3) --ignore-snapshots --reporter=list,github
      # Synthetic data only: traces of the mocked dashboard. Small, 7 days.
      - name: Keep failure traces (7 days)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          name: playwright-failures-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The local database suite on a throwaway PostgreSQL 16 service.
  database:
    name: Local database suite (throwaway PostgreSQL)
    needs: static
    if: needs.static.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # EXT20: pinned to the image digest Docker Hub's registry returned for the tag
        # postgres:16 on 2026-10-17 (multi-architecture index). The tag alone could change
        # silently. To refresh: read the new digest from the registry (never invent one),
        # update it here, and let the database job prove it.
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_PASSWORD: ci-only-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: ci-only-local
      QUICK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          node-version: 22
      - name: Run the database suite
        run: bash tests/tools/run-db-suite.sh -h localhost -p 5432 -U postgres

  # Informational: pixel comparisons can differ on GitHub's fonts. Never blocks.
  visual:
    name: Screenshots (informational)
    needs: static
    if: needs.static.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (v4 tag on 2026-10-12; verified with git ls-remote)
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/playwright.config.js tests/specs/visual.spec.js --reporter=list,github
